[package]
name = "fund-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
chrono = "0.4.39"
clap = { version = "4.5.60", features = ["derive"] }
comfy-table = "7.2.2"
csv = "1.4.0"
dirs = "6.0.0"
futures = "0.3.32"
once_cell = "1.21.3"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
rust_decimal = "1.40.0"
rust_decimal_macros = "1.40.0"
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
urlencoding = "2.1.3"

[dev-dependencies]
assert_cmd = "2.1.2"
mockall = "0.14.0"
predicates = "3.1.4"
tempfile = "3.26.0"
