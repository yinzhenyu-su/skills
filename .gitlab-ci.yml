stages:
  - build
  - publish

variables:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: fund-manager

.default-rules: &default-rules
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build_linux:
  stage: build
  image: rust:1.90
  tags: [linux]
  <<: *default-rules
  script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates tar gzip
    - cd skills/fund-manager
    - cargo build --release --locked
    - VERSION="${CI_COMMIT_TAG#v}"; if [ -z "$VERSION" ] || [ "$VERSION" = "$CI_COMMIT_TAG" ]; then VERSION="0.0.0-${CI_COMMIT_SHORT_SHA}"; fi
    - TARGET_TRIPLE="x86_64-unknown-linux-gnu"
    - ASSET_NAME="fund-manager-v${VERSION}-${TARGET_TRIPLE}.tar.gz"
    - mkdir -p dist
    - cp target/release/fund-manager dist/fund-manager
    - tar -czf "dist/${ASSET_NAME}" -C dist fund-manager
    - rm -f dist/fund-manager
    - echo "$ASSET_NAME" > dist/linux.asset
  artifacts:
    expire_in: 7 days
    paths:
      - skills/fund-manager/dist/*

build_macos:
  stage: build
  tags: [macos]
  <<: *default-rules
  script:
    - cd skills/fund-manager
    - rustup toolchain install stable
    - rustup default stable
    - cargo build --release --locked
    - VERSION="${CI_COMMIT_TAG#v}"; if [ -z "$VERSION" ] || [ "$VERSION" = "$CI_COMMIT_TAG" ]; then VERSION="0.0.0-${CI_COMMIT_SHORT_SHA}"; fi
    - TARGET_TRIPLE="aarch64-apple-darwin"
    - ASSET_NAME="fund-manager-v${VERSION}-${TARGET_TRIPLE}.tar.gz"
    - mkdir -p dist
    - cp target/release/fund-manager dist/fund-manager
    - tar -czf "dist/${ASSET_NAME}" -C dist fund-manager
    - rm -f dist/fund-manager
    - echo "$ASSET_NAME" > dist/macos.asset
  artifacts:
    expire_in: 7 days
    paths:
      - skills/fund-manager/dist/*

build_windows:
  stage: build
  tags: [windows]
  <<: *default-rules
  script:
    - cd skills/fund-manager
    - rustup toolchain install stable
    - rustup default stable
    - cargo build --release --locked
    - |
      $version = $env:CI_COMMIT_TAG
      if (-not $version) { $version = "0.0.0-$env:CI_COMMIT_SHORT_SHA" }
      if ($version.StartsWith("v")) { $version = $version.Substring(1) }
      $target = "x86_64-pc-windows-msvc"
      $asset = "fund-manager-v$version-$target.zip"
      New-Item -ItemType Directory -Path dist -Force | Out-Null
      Copy-Item target/release/fund-manager.exe dist/fund-manager.exe -Force
      Compress-Archive -Path dist/fund-manager.exe -DestinationPath ("dist/" + $asset) -Force
      Remove-Item dist/fund-manager.exe -Force
      Set-Content -Path dist/windows.asset -Value $asset -NoNewline
  artifacts:
    expire_in: 7 days
    paths:
      - skills/fund-manager/dist/*

publish_package:
  stage: publish
  image: curlimages/curl:8.13.0
  tags: [linux]
  needs:
    - job: build_linux
      artifacts: true
    - job: build_macos
      artifacts: true
    - job: build_windows
      artifacts: true
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - test -n "$CI_COMMIT_TAG"
    - VERSION="${CI_COMMIT_TAG#v}"
    - DIST_DIR="skills/fund-manager/dist"
    - test -d "$DIST_DIR"
    - |
      for file in "$DIST_DIR"/*.tar.gz "$DIST_DIR"/*.zip; do
        [ -f "$file" ] || continue
        name="$(basename "$file")"
        url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${VERSION}/${name}"
        echo "Uploading $name"
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$file" "$url"
        echo "Validating $name"
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --head "$url"
      done
